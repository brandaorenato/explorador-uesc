<style>

:root[data-map="night"]{--ground:#1d3552;--grass:#1f4a4a;--water:#17527a;--waterhi:#2a7aa6;--road:#3c5a85;--edge:#2c4468;--side:#243a58;--roof:#35507a;--tree:#1f6f55;--treehi:#2f9070;--ui:#1c2e45;--text:#e8f3ff;--muted:#9ab4cc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--text);font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;font-weight:600}
#app{position:relative;height:100%}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;background:var(--ground)}
.top{position:absolute;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:480px}

.mode{position:absolute;left:10px;bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ui);box-shadow:var(--shadow);border-radius:16px;padding:8px 12px;font-size:12px;color:var(--muted);max-width:58%}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ui);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);max-height:68%;overflow:auto}
.sheet.open{transform:none}
.sheet .ban{padding:18px 18px 14px;color:#fff;border-radius:26px 26px 0 0;display:flex;gap:12px;align-items:center}
.sheet .ico{width:58px;height:58px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;border:4px solid rgba(255,255,255,.6);flex:none}
.sheet h2{margin:0;font-size:19px;line-height:1.2}
.sheet .sub{font-size:12px;opacity:.92;margin-top:2px}

.sheet p{margin:0 0 10px;font-size:14px;line-height:1.45;font-weight:500}

.btn{width:100%;border:0;border-radius:16px;padding:13px;font:inherit;font-size:15px;cursor:pointer;color:#fff;background:linear-gradient(145deg,#27c9b8,#14a091);box-shadow:0 4px 0 #0d7a6e}
.btn[disabled]{background:#a9bcc6;box-shadow:0 4px 0 #8aa0ac;cursor:default}

.close{position:absolute;right:10px;top:8px;border:0;background:rgba(0,0,0,.2);color:#fff;width:30px;height:30px;border-radius:50%;font-size:18px;cursor:pointer}

.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes ring{0%{r:16;opacity:.7}100%{r:40;opacity:0}}
.ring{animation:ring 2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.bob{animation:bob 2s ease-in-out infinite}
@keyframes pulse{0%{r:12;opacity:.5}100%{r:30;opacity:0}}
.pulse{animation:pulse 1.8s infinite}
.fabs,.mode{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.sheet{bottom:calc(58px + env(safe-area-inset-bottom,0px));border-radius:26px;max-height:62%}
.toast{z-index:40}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--ui);box-shadow:0 -4px 18px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}

.panel{position:absolute;left:0;right:0;top:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ground);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 20px;display:none}

.g1{background:linear-gradient(135deg,#8fdcf5,#6d6be0 62%,#3b3fd8)}

function medalById(id){return MEDALS.filter(function(m){return m.id===id})[0]}
function tierOf(m){var n=m.f(),t=0;m.t.forEach(function(x,i){if(n>=x)t=i+1});return t}
function nextInfo(m){var n=m.f(),t=tierOf(m),pv=t?m.t[t-1]:0,nx=t<4?m.t[t]:m.t[3];return{n:n,t:t,nx:nx,pct:t>=4?100:Math.max(0,Math.min(100,(n-pv)/(nx-pv)*100))}}

// ----- contadores diários e semanais -----
function dkey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function wkey(){var d=new Date();return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(2024,0,1))/6048e5)}
function roll(){var a=dkey(),b=wkey();if(dy.k!==a)dy={k:a,v:0,r:0,a:0,w:0};if(wy.k!==b)wy={k:b,v:0,r:0,a:0,w:0}}
function bump(t,n){roll();dy[t]+=n;wy[t]+=n;save()}
var lp=null,wc=0;
function walkTrack(){if(lp){var d=Math.hypot(player.x-lp.x,player.y-lp.y);if(d>0&&d<80){roll();wk+=d;dy.w+=d;wy.w+=d;if(++wc%40===0){save();checkBadges()}}}lp={x:player.x,y:player.y}}
function tleft(per){var d=new Date();if(per==='d'){var m=Math.max(0,Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)-d)/6e4));return'🕒 '+Math.floor(m/60)+' h '+(m%60)+' m'}var n=8-(d.getDay()||7);return'🕒 '+n+(n===1?' dia':' dias')}
