<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--text);font-family:ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;font-weight:600}

.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--ui);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.28);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1.1);max-height:68%;overflow:auto}

.btn{width:100%;border:0;border-radius:16px;padding:13px;font:inherit;font-size:15px;cursor:pointer;color:#fff;background:linear-gradient(145deg,#27c9b8,#14a091);box-shadow:0 4px 0 #0d7a6e}

@keyframes ring{0%{r:16;opacity:.7}100%{r:40;opacity:0}}

function medalById(id){return MEDALS.filter(function(m){return m.id===id})[0]}
function tierOf(m){var n=m.f(),t=0;m.t.forEach(function(x,i){if(n>=x)t=i+1});return t}
function nextInfo(m){var n=m.f(),t=tierOf(m),pv=t?m.t[t-1]:0,nx=t<4?m.t[t]:m.t[3];return{n:n,t:t,nx:nx,pct:t>=4?100:Math.max(0,Math.min(100,(n-pv)/(nx-pv)*100))}}

// ----- contadores diários e semanais -----
function dkey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function wkey(){var d=new Date();return Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(2024,0,1))/6048e5)}
function roll(){var a=dkey(),b=wkey();if(dy.k!==a)dy={k:a,v:0,r:0,a:0,w:0};if(wy.k!==b)wy={k:b,v:0,r:0,a:0,w:0}}
function bump(t,n){roll();dy[t]+=n;wy[t]+=n;save()}
var lp=null,wc=0;
function walkTrack(){if(lp){var d=Math.hypot(player.x-lp.x,player.y-lp.y);if(d>0&&d<80){roll();wk+=d;dy.w+=d;wy.w+=d;if(++wc%40===0){save();checkBadges()}}}lp={x:player.x,y:player.y}}
function tleft(per){var d=new Date();if(per==='d'){var m=Math.max(0,Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate()+1)-d)/6e4));return'🕒 '+Math.floor(m/60)+' h '+(m%60)+' m'}var n=8-(d.getDay()||7);return'🕒 '+n+(n===1?' dia':' dias')}
